# Reconnaissance Framework Configuration

[General]
timeout = 300
retry_count = 3
output_format = json

[Nmap]
enabled = true
default_scan_type = basic
enable_os_detection = true
enable_service_detection = true
enable_script_scanning = true

[DNS]
enabled = true
perform_zone_transfer = false
perform_reverse_lookup = true
nameservers = 8.8.8.8,1.1.1.1

[TheHarvester]
enabled = true
limit = 500
sources = google,bing,linkedin,twitter

[Amass]
enabled = true
enable_intel = true
enable_tracking = false

[Gobuster]
enabled = true
default_wordlist = /usr/share/wordlists/dirb/common.txt
extensions = php,html,txt,js,css
threads = 50

[Output]
directory = output
format = json
save_raw_output = true
generate_html_report = true
